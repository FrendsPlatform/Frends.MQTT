# Logging
log_dest stdout
log_type all

# Persistence
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
max_queued_messages 1000
message_size_limit 0
retain_available true
password_file /mosquitto/output/passwd

# Standard MQTT listener
listener 1883
allow_anonymous false

# TLS listener - username/password authentication
listener 8883
certfile /mosquitto/output/server.crt
keyfile /mosquitto/output/server.key
cafile /mosquitto/output/ca.crt
tls_version tlsv1.2
allow_anonymous false

# TLS listener - client certificate authentication
listener 8884
certfile /mosquitto/output/server.crt
keyfile /mosquitto/output/server.key
cafile /mosquitto/output/ca.crt
require_certificate true
allow_anonymous true
